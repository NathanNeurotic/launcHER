name: Build launcHER

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:
      - name: Install build tools
        run: apk add cmake zip

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch full clone
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --prune --unshallow

      - name: Build launcHER
        run: |
          cmake -B build
          cmake --build build --target launcHER

      - name: Package launcHER
        run: |
          cd build/release
          grep -Eq '^version=([[:xdigit:]]{12}|v[0-9][0-9A-Za-z._-]*)$' version.txt
          test "$(wc -l < version.txt)" -eq 1
          zip -9 launcHER.zip launcHER.elf launcHER.CNF version.txt

      - name: Upload launcHER
        uses: actions/upload-artifact@v4
        with:
          name: launcHER
          if-no-files-found: error
          path: |
            build/release/launcHER.elf
            build/release/launcHER.CNF
            build/release/version.txt
            build/release/launcHER.zip

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/EMBER'
    steps:
      - name: Download launcHER assets
        uses: actions/download-artifact@v4
        with:
          name: launcHER
          path: release

      # GitHub automatically adds Source code (zip) and Source code (tar.gz).
      # We additionally publish the raw ELF, editable CNF, and ready-to-use ZIP.
      - uses: "marvinpinto/action-automatic-releases@latest"
        if: github.ref == 'refs/heads/EMBER'
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "nightly"
          prerelease: true
          title: "launcHER nightly"
          files: |
            release/launcHER.elf
            release/launcHER.CNF
            release/version.txt
            release/launcHER.zip

      # The automatic-releases action rejects tags that are not full semver
      # (v1.0 failed; v1.0.0 would pass), so tag pushes use the gh CLI. If a
      # release for the tag already exists it is left unchanged.
      - name: Draft release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "A release for $TAG already exists; leaving it unchanged."
          else
            gh release create "$TAG" --draft --verify-tag --generate-notes \
              release/launcHER.elf release/launcHER.CNF release/version.txt release/launcHER.zip
          fi
