name: Build launcHER

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:
      - name: Install cmake
        run: apk add cmake

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch full clone
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --prune --unshallow

      - name: Build launcHER
        run: |
          cmake -B build
          cmake --build build --target launcHER

      - name: Upload launcHER
        uses: actions/upload-artifact@v4
        with:
          name: launcHER
          if-no-files-found: error
          path: |
            build/release/launcHER.elf
            build/release/launcHER.CNF

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/EMBER'
    steps:
      - name: Download launcHER
        uses: actions/download-artifact@v4
        with:
          name: launcHER
          path: release

      - uses: "marvinpinto/action-automatic-releases@latest"
        if: github.ref == 'refs/heads/EMBER'
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "nightly"
          prerelease: true
          title: "launcHER nightly"
          files: |
            release/launcHER.elf
            release/launcHER.CNF

      - uses: "marvinpinto/action-automatic-releases@latest"
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          draft: true
          files: |
            release/launcHER.elf
            release/launcHER.CNF
